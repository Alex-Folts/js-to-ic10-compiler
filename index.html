<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>IC10 Compiler</title>

<style>
  :root{
    --bg:#f6f7f8;
    --panel:#fff;
    --muted:#666;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", "Courier New", monospace;
  }

  html,body{height:100%;margin:0;background:var(--bg);font-family:Inter, system-ui, Helvetica, Arial, sans-serif;color:#111}
  /* page layout: header + main (two columns) + footer (optional) */
  .page { display:flex; flex-direction:column; height:100vh; gap:12px; padding:14px; box-sizing:border-box; }
  header{display:flex;align-items:center;gap:12px}
  header h1{margin:0;font-size:18px;font-weight:600}
  header .subtitle{color:var(--muted); font-size:13px}

  /* main area stretches */
  .main { display:flex; gap:12px; flex:1; min-height:0; } /* min-height:0 important for children flex overflow */

  .col { background:var(--panel); border-radius:8px; padding:12px; box-shadow:0 1px 0 rgba(0,0,0,0.03); display:flex; flex-direction:column; min-width:0; }
  .col h3 { margin:0 0 8px 0; font-size:14px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

  /* editor area must fill remaining vertical space; CodeMirror will be sized to 100% */
  .editorWrap { display:flex; flex-direction:column; gap:8px; flex:1; min-height:0; }
  .editorTop { display:flex; align-items:center; justify-content:space-between; gap:8px; padding-bottom:8px}
  .leftTools { display:flex; gap:8px; align-items:center; }
  .rightTools { display:flex; gap:8px; align-items:center; }

  .editorHolder { flex:1; min-height:0; border-radius:6px; overflow:hidden; border:1px solid #e6e6e9; }
  .outputHolder  { flex:1; min-height:0; display:flex; flex-direction:column; gap:8px; }

  /* output pre-scroller */
  .outbox { flex:1; min-height:0; overflow:auto; padding:12px; background:#0f1110; color:#e6e6db; border-radius:6px; font-size:13px; white-space:pre-wrap; }

  /* buttons and inputs */
  button { cursor:pointer; border:1px solid #a0a0a3; background:#f1f1f1; border-radius:6px; padding:8px 10px; font-size:13px; }
  button:active{transform:translateY(1px)}
  .small { font-size:12px; color:var(--muted) }

  .linecount { font-family:var(--mono); font-size:13px; color:var(--muted); margin-right:auto; }

  .status-over { color:crimson; font-weight:700; }

  /* make CodeMirror fill container */
  .CodeMirror { height:100% !important; }

  /* hint/autocomplete styling (from codemirror addon) */
  .CodeMirror-hints { font-family:inherit; font-size:13px; }

  /* footer */
  footer { font-size:12px; color:var(--muted); display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .flexrow { display:flex; gap:8px; align-items:center; }

  /* responsive shrink */
  @media (max-width:900px){
    .main{ flex-direction:column; }
  }
</style>

<!-- CodeMirror core -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>

<!-- hint/autocomplete addons -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/javascript-hint.min.js"></script>

<!-- Esprima parser -->
<script src="https://unpkg.com/esprima@4.0.1/dist/esprima.js"></script>

<!-- Your compiler & handlers (assumed present) -->
<script src="callHandlers.js"></script>
<script src="ic10compiler.js"></script>
</head>
<body>
<div class="page">

  <header>
    <div style="display:flex;flex-direction:column">
      <h1>Javascript → IC10</h1>
      <div class="subtitle">Compile a small JS subset to Stationeers IC10</div>
    </div>
    <div style="margin-left:auto" class="small">IC10 compiler</div>
  </header>

  <main class="main">
    <!-- left: editor -->
    <section class="col" style="flex:1 1 60%;">
      <div class="editorTop">
        <div class="leftTools">
          <div class="toolbar">
            <button id="compile">Compile → IC10</button>
            <button id="save_proj">Save</button>
            <button id="load_proj">Load</button>
            <button id="info">Info</button>
            <label style="display:flex;align-items:center;gap:6px;margin-left:6px;">
              <input id="debugCheck" type="checkbox" /> <span class="small">Debug mode</span>
            </label>
          </div>
        </div>

        <div class="rightTools small">
          <span></span>
        </div>
      </div>

      <div class="editorHolder editorWrap">
        <textarea id="src">
// Example: math + device read/write
var a = 2;
var b = 10;
var sum = a + b * 3;

// read temperature from device on d0
var temp = IC10.d0.Temperature;

IC10.yield();

// set the On property of device d1 based on condition
if (sum > temp) {
  IC10.d1.On = 1;
} else {
  IC10.d1.On = 0;
}

IC10.sleep(1);

// simple loop: increment a until 5
while (a < 5) {
  a = a + 1;
}
        </textarea>
      </div>
    </section>

    <!-- right: output -->
    <section class="col" style="flex:1 1 40%;">
      <h3 style="display:flex;align-items:center;justify-content:space-between">
        <span>Generated IC10</span>
        <span style="display:flex;align-items:center;gap:8px">
          <span id="lineCount" class="linecount">0 / 128</span>
          <div class="toolbar" style="margin-left:8px">
            <button id="clear">Clear</button>
            <button id="copy">Copy</button>
            <button id="open_sim">Simulator</button>
          </div>
        </span>
      </h3>

      <div class="outputHolder">
        <pre id="out" class="outbox"># (nothing yet)</pre>
      </div>
    </section>
  </main>

  <footer>
    <div class="small">Supported subset: var/const, assignments, binary/unary, if/while/for/switch, Math.*, IC10.* device reads/writes.</div>
    <div class="small">Line limit: 128</div>
  </footer>
</div>

<!-- hidden file input for load -->
<input id="inp" type="file" style="display:none" />

<script>
	// Initialize CodeMirror
	const editor = CodeMirror.fromTextArea(document.getElementById('src'), {
			mode: 'javascript',
			lineNumbers: true,
			tabSize: 2,
			indentWithTabs: false,
			extraKeys: {
				"Ctrl-Space": "autocomplete"
			},
			hintOptions: {
				completeSingle: false
			}
		});

	// ---------------------- combined autocomplete (JS + IC10) ----------------------
	// list of IC10 virtual-lib completions
	const IC10_COMPLETIONS = [
		// top-level object
		"IC10",
		// functions / commands
		"IC10.sleep", "IC10.yield", "IC10.hcf", "IC10.lerp", "IC10.HASH",
		// device pins
		"IC10.d0", "IC10.d1", "IC10.d2", "IC10.d3", "IC10.d4", "IC10.d5", "IC10.db",
		// common device properties (examples)
		"IC10.d0.Temperature", "IC10.d0.Pressure", "IC10.d1.On"
	];

	// helper: produce a merged hint list by invoking default JS hint, then appending our items
	function combinedJsIc10Hint(cm, options) {
		// call built-in JS hint first
		let base = CodeMirror.hint.javascript(cm, options) || {
			list: [],
			from: cm.getCursor(),
			to: cm.getCursor()
		};

		// compute prefix (token at cursor). Use token.string truncated to cursor
		const cur = cm.getCursor();
		const token = cm.getTokenAt(cur);
		const start = token.start;
		const prefix = token.string.slice(0, cur.ch - start);

		// extend with our completions that match prefix and are not already present
		const existingTexts = new Set(base.list.map((it) => (typeof it === 'string' ? it : (it.text || it.displayText))));
		const extras = IC10_COMPLETIONS
			.filter(w => {
				if (!prefix)
					return true; // show all if prefix empty
				return w.toLowerCase().startsWith(prefix.toLowerCase());
			})
			.filter(w => !existingTexts.has(w))
			.map(w => ({
					text: w,
					displayText: w
				}));

		base.list = base.list.concat(extras);
		return base;
	}

	// show combined hint on Ctrl-Space (already configured) and also show on dot typing
	editor.setOption('extraKeys', Object.assign({}, editor.getOption('extraKeys'), {
			"Ctrl-Space": (cm) => CodeMirror.showHint(cm, combinedJsIc10Hint, {
				completeSingle: false
			})
		}));

	// show hints automatically when '.' typed
	editor.on('keyup', (cm, evt) => {
		// only trigger on printable '.' character
		if (evt.key === '.') {
			CodeMirror.showHint(cm, combinedJsIc10Hint, {
				completeSingle: false
			});
		}
	});

	// ---------------------- output CodeMirror + simple ic10 mode ----------------------
	// 1) Define a very small mode for IC10 assembly-like highlighting
	CodeMirror.defineMode("ic10", function () {
		const keywords = /^(move|add|sub|mul|div|mod|seq|sne|slt|sle|sgt|sge|l|s|j|beq|bne|blt|bgt|ble|bge|select|peek|poke|push|pop|define|select|max|min|atan2|abs|acos|asin|atan|cos|sin|tan|ceil|exp|floor|log|rand|round|sqrt|trunc|sleep|yield|hcf)\b/i;
		return {
			token: function (stream) {
				if (stream.eatSpace())
					return null;
				if (stream.match(/^[A-Za-z_]\w*:/))
					return "def"; // label:
				if (stream.match(keywords))
					return "keyword"; // opcodes
				if (stream.match(/^r\d+\b/))
					return "variable-2"; // registers
				if (stream.match(/^d(\d|b)\b/))
					return "variable-3"; // devices
				if (stream.match(/^(pinf|ninf|nan)\b/i))
					return "atom"; // special constants
				if (stream.match(/^[A-Za-z_]\w*\d+\b/))
					return "def"; // labels2
				if (stream.match(/^-?\d+(\.\d+)?\b/))
					return "number"; // numbers
				if (stream.match(/^"([^"]*)"/) || stream.match(/^'([^']*)'/))
					return "string"; // quoted
				if (stream.match(/^#.*$/)) {
					stream.skipToEnd();
					return "comment";
				} // comments (if you use #)
				// anything else: advance one char
				stream.next();
				return null;
			}
		};
	});

	// 2) Replace the <pre id="out"> with a CodeMirror instance (read-only).
	// Find the existing PRE node
	(function createOutputCm() {
		const outPre = document.getElementById('out');
		if (!outPre)
			return;

		const holder = document.createElement('div');
		holder.style.height = '100%';
		holder.style.minHeight = '0';

		// replace pre with holder
		outPre.parentNode.replaceChild(holder, outPre);

		// create CM instance inside holder
		window.outEditor = CodeMirror(holder, {
				value: outPre.textContent || '',
				mode: 'ic10',
				readOnly: 'nocursor',
				lineNumbers: true,
				viewportMargin: Infinity
			});

		// style the editor to match the output area
		outEditor.getWrapperElement().style.height = '100%';
		outEditor.getWrapperElement().style.borderRadius = '2px';
		outEditor.getWrapperElement().classList.add('outbox');
		outEditor.getWrapperElement().style.background = '#0f1110';
		outEditor.getWrapperElement().style.color = '#e6e6db';
		outEditor.getWrapperElement().style.borderRadius = '6px';
		outEditor.getWrapperElement().style.fontSize = '15px';
		
		outEditor.getGutterElement().style.background = '#0f1110';

		// helper to set output text (and update highlight)
		window.setOutputIC10 = function (text) {
			outEditor.setValue(text || '');
		};

		// helper to get current output text
		window.getOutputIC10 = function () {
			return outEditor.getValue();
		};

		// initialize with existing text
		setOutputIC10(outPre.textContent || '');
	})();

	// ensure CodeMirror fills its container height
	function resizeEditors() {
		const holder = document.querySelector('.editorHolder');
		if (holder) {
			const rect = holder.getBoundingClientRect();
			// set height for CodeMirror
			editor.setSize(null, rect.height + "px");
		}
		// ensure outbox height is correct (flex takes care of it)
	}
	window.addEventListener('resize', resizeEditors);
	// initial
	setTimeout(resizeEditors, 50);

	// utils
	function copyTextToClipboard(text) {
		return navigator.clipboard.writeText(text);
	}
	function download(filename, text) {
		const a = document.createElement('a');
		a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(text);
		a.download = filename;
		a.style.display = 'none';
		document.body.appendChild(a);
		a.click();
		document.body.removeChild(a);
	}
	function addWarning(wtext) {
		console.warn(wtext);
	}

	// UI elements
	const outEl = document.getElementById('out');
	const compileBtn = document.getElementById('compile');
	const clearBtn = document.getElementById('clear');
	const copyBtn = document.getElementById('copy');
	const saveBtn = document.getElementById('save_proj');
	const loadBtn = document.getElementById('load_proj');
	const inp = document.getElementById('inp');
	const simBtn = document.getElementById('open_sim');
	const lineCountEl = document.getElementById('lineCount');
	const debugCheck = document.getElementById('debugCheck');
	const infoBtn = document.getElementById('info');

	let compileError = false;

	function updateLineCountFromText(text) {
		if (!text) {
			lineCountEl.textContent = '0 / 128';
			lineCountEl.classList.remove('status-over');
			return;
		}
		const lines = text.split('\n').length;
		lineCountEl.textContent = lines + ' / 128';
		if (lines > 128) {
			lineCountEl.classList.add('status-over');
			addWarning("Exceeded line count for IC10 program! (" + lines + " / 128)");
		} else
			lineCountEl.classList.remove('status-over');
	}

	compileBtn.addEventListener('click', () => {
		const src = editor.getValue();
		compileError = false;
		let ast;
		try {
			ast = esprima.parseScript(src);
			console.log(ast);
		} catch (e) {
			setOutputIC10('# Parse error: ' + e.message);
			compileError = true;
			updateLineCountFromText('');
			return;
		}

		try {
			const c = new IC10Compiler({
					debug: !!debugCheck.checked
				});

			// register handlers (your callHandlers file should export these classes)
			if (typeof JsIC10CallHandlers !== 'undefined') {
				const jsIC10CallHandlers = new JsIC10CallHandlers();
				jsIC10CallHandlers.Register(c);
			}
			if (typeof JsMathCallHandlers !== 'undefined') {
				const jsMathCallHandlers = new JsMathCallHandlers();
				jsMathCallHandlers.Register(c);
			}

			const ic = c.compileProgram(ast);
			setOutputIC10(ic || '(empty)');
			updateLineCountFromText(ic || '');
		} catch (e) {
			setOutputIC10('# Compile error: ' + e.message);
			compileError = true;
			updateLineCountFromText('');
		}
	});

	clearBtn.addEventListener('click', () => {
		setOutputIC10('');
		updateLineCountFromText('');
	});

	copyBtn.addEventListener('click', () => {
		if (compileError)
			return;
		copyTextToClipboard(getOutputIC10()).catch(() => { /*ignore*/
		});
	});

	saveBtn.addEventListener('click', () => {
		const src = editor.getValue();
		const projObj = {
			source: src
		};
		download('project.json', JSON.stringify(projObj));
	});

	loadBtn.addEventListener('click', () => {
		inp.value = null;
		inp.click();
	});

	inp.addEventListener('change', (e) => {
		const f = e.target.files && e.target.files[0];
		if (!f)
			return;
		const reader = new FileReader();
		reader.onload = (ev) => {
			try {
				const obj = JSON.parse(ev.target.result);
				if (obj && obj.source)
					editor.setValue(obj.source);
			} catch (err) {
				alert('Failed to load project: ' + err.message);
			}
		};
		reader.readAsText(f);
	});

	simBtn.addEventListener('click', () => {
		if (compileError)
			return;
		const payloadObj = {
			"program": "",
			"registers": {
				"io": [{}, {}, {}, {}, {}, {}, {}
				],
				"ioConnected": [true, true, true, true, true, true, true],
				"internal": Array(18).fill(0),
				"ioSlot": [{}, {}, {}, {}, {}, {}, {}
				],
				"ioReagent": [{}, {}, {}, {}, {}, {}, {}
				]
			},
			"runAfterRegisterChange": false,
			"runWithErrors": false
		};
		payloadObj.program = getOutputIC10();
		const payload = JSON.stringify(payloadObj);
		const urlParam = window.btoa(payload);
		const baseUrl = "https://stationeering.com/tools/ic#";
		window.open(baseUrl + urlParam, '_blank').focus();
	});

	infoBtn.addEventListener('click', () => {
		// no-op for now; reserved for future
		alert('Info button — reserved for future help/about text.');
	});

	// initial counter update
	updateLineCountFromText(getOutputIC10());

	// trigger initial resize after DOM paint
	setTimeout(resizeEditors, 120);
</script>
</body>
</html>
