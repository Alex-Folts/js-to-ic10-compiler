<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Esprima → Instruction Compiler (toy)</title>
  <style>
    body { font-family: system-ui, Arial; padding: 20px; }
    textarea { width: 100%; height: 160px; font-family: monospace; }
    pre { background:#f6f8fa; padding:10px; border-radius:6px; }
  </style>
</head>
<body>
  <h1>Toy JS → Instruction Compiler (Esprima)</h1>
  <p>Paste JS in the left box and click <b>Compile</b>.</p>

  <textarea id="src">
// example
var x = 2;
var y = x + 3;
if (y > 4) {
  y = y * 2;
} else {
  y = y - 1;
}
while (x < 6) {
  x = x + 1;
}
  </textarea>
  <p><button id="compile">Compile</button></p>

  <h3>Generated instructions</h3>
  <pre id="out">(nothing yet)</pre>

  <!-- Esprima CDN -->
  <script src="https://unpkg.com/esprima@4.0.1/dist/esprima.js"></script>
  <script>
  // --- Compiler implementation ---
  class Compiler {
    constructor() {
      this.code = [];
      this.labelId = 0;
    }
    emit(op, ...args) {
      const argStr = args.map(a => {
        if (typeof a === 'string' && a.includes(' ')) return `"${a}"`;
        return String(a);
      }).join(' ');
      this.code.push(argStr ? `${op} ${argStr}` : op);
    }
    newLabel(prefix='L') {
      return prefix + (this.labelId++);
    }

    compileProgram(ast) {
      ast.body.forEach(stmt => this.compileStatement(stmt));
      return this.code;
    }

    compileStatement(node) {
      if (!node) return;
      switch (node.type) {
        case 'VariableDeclaration':
          for (const d of node.declarations) {
            const name = d.id.name;
            if (d.init) {
              this.compileExpression(d.init);
            } else {
              this.emit('PUSH_CONST', 0);
            }
            this.emit('STORE_VAR', name);
          }
          break;

        case 'ExpressionStatement':
          this.compileExpression(node.expression);
          this.emit('POP');
          break;

        case 'IfStatement': {
          const elseLabel = this.newLabel('else');
          const endLabel = this.newLabel('end');
          this.compileExpression(node.test);
          this.emit('JUMP_IF_FALSE', elseLabel);
          this.compileStatement(node.consequent);
          this.emit('JUMP', endLabel);
          this.emit('LABEL', elseLabel);
          if (node.alternate) this.compileStatement(node.alternate);
          this.emit('LABEL', endLabel);
          break;
        }

        case 'BlockStatement':
          node.body.forEach(s => this.compileStatement(s));
          break;

        case 'WhileStatement': {
          const start = this.newLabel('while_start');
          const end = this.newLabel('while_end');
          this.emit('LABEL', start);
          this.compileExpression(node.test);
          this.emit('JUMP_IF_FALSE', end);
          this.compileStatement(node.body);
          this.emit('JUMP', start);
          this.emit('LABEL', end);
          break;
        }

        case 'ForStatement': {
          // naive lowering: init; while(test) { body; update }
          if (node.init) this.compileStatement(node.init);
          const start = this.newLabel('for_start');
          const end = this.newLabel('for_end');
          this.emit('LABEL', start);
          if (node.test) {
            this.compileExpression(node.test);
            this.emit('JUMP_IF_FALSE', end);
          }
          this.compileStatement(node.body);
          if (node.update) this.compileExpression(node.update), this.emit('POP'); // discard update result
          this.emit('JUMP', start);
          this.emit('LABEL', end);
          break;
        }

        case 'ReturnStatement':
          if (node.argument) this.compileExpression(node.argument);
          this.emit('RET');
          break;

        case 'FunctionDeclaration':
          // For simplicity, treat function body as inline (not creating closure env)
          // Real compilers emit separate function sections.
          // We'll just emit a label and body, callable by CALL <name> <argc>.
          const fname = node.id.name;
          const fLabel = `fn_${fname}`;
          this.emit('LABEL', fLabel);
          // params handling omitted: we assume args on stack and STORE_VAR should be done before body
          this.compileStatement(node.body);
          this.emit('RET');
          break;

        default:
          throw new Error('Unhandled statement type: ' + node.type);
      }
    }

    compileExpression(node) {
      if (!node) return;
      switch (node.type) {
        case 'Literal':
          this.emit('PUSH_CONST', node.value);
          break;

        case 'Identifier':
          this.emit('PUSH_VAR', node.name);
          break;

        case 'BinaryExpression':
          // compile left then right (so stack: ... left right)
          this.compileExpression(node.left);
          this.compileExpression(node.right);
          this.emit(this.mapBinaryOp(node.operator));
          break;

        case 'AssignmentExpression':
          if (node.left.type !== 'Identifier') throw new Error('Only simple assignments supported');
          // compute RHS then store
          this.compileExpression(node.right);
          this.emit('STORE_VAR', node.left.name);
          break;

        case 'UpdateExpression': {
          // ++a or a++
          const name = node.argument.name;
          if (node.prefix) {
            this.emit('PUSH_VAR', name);
            this.emit('PUSH_CONST', 1);
            this.emit('BINARY_ADD');
            this.emit('STORE_VAR', name);
            this.emit('PUSH_VAR', name);
          } else {
            // postincrement: push old value, then increment and store
            this.emit('PUSH_VAR', name);
            this.emit('PUSH_CONST', 1);
            this.emit('BINARY_ADD');
            this.emit('STORE_VAR', name);
            this.emit('PUSH_VAR', name); // naive (this returns incremented value)
          }
          break;
        }

        case 'LogicalExpression': {
          // implement short-circuit: left && right  => if(!left) push left else push right
          if (node.operator === '&&') {
            const end = this.newLabel('land_end');
            const pushFalse = this.newLabel('land_false');
            this.compileExpression(node.left);       // left
            this.emit('JUMP_IF_FALSE', end);        // if left false -> skip right
            this.compileExpression(node.right);      // push right
            this.emit('LABEL', end);
          } else if (node.operator === '||') {
            const end = this.newLabel('lor_end');
            this.compileExpression(node.left);
            this.emit('JUMP_IF_FALSE', 'skip_right_' + this.labelId); // not perfect; kept simple
            // Simplified: not fully correct for short-circuit — production code should handle labels properly
            this.compileExpression(node.right);
            this.emit('LABEL', end);
          } else {
            throw new Error('Unsupported logical operator: ' + node.operator);
          }
          break;
        }

        case 'CallExpression': {
          // compile args left-to-right so they are pushed in order
          const args = node.arguments || [];
          for (const a of args) this.compileExpression(a);
          if (node.callee.type === 'Identifier') {
            this.emit('CALL', node.callee.name, args.length);
          } else {
            throw new Error('Only simple function calls supported in demo');
          }
          break;
        }

        case 'MemberExpression':
          // For demo, not implemented. Would be LOAD_PROP etc.
          throw new Error('MemberExpression not implemented in demo');

        default:
          throw new Error('Unhandled expression type: ' + node.type);
      }
    }

    mapBinaryOp(op) {
      switch(op) {
        case '+': return 'BINARY_ADD';
        case '-': return 'BINARY_SUB';
        case '*': return 'BINARY_MUL';
        case '/': return 'BINARY_DIV';
        case '==': case '===': return 'BINARY_EQ';
        case '<': return 'BINARY_LT';
        case '<=': return 'BINARY_LE';
        case '>': return 'BINARY_GT';
        case '>=': return 'BINARY_GE';
        default: throw new Error('Unsupported binary op: ' + op);
      }
    }
  }

  // UI wiring
  document.getElementById('compile').addEventListener('click', () => {
    const src = document.getElementById('src').value;
    let ast;
    try {
      ast = esprima.parseScript(src, {range:true});
    } catch (e) {
      document.getElementById('out').textContent = 'Parse error: ' + e.message;
      return;
    }
    try {
      const c = new Compiler();
      const instr = c.compileProgram(ast);
      document.getElementById('out').textContent = instr.join('\n');
    } catch (e) {
      document.getElementById('out').textContent = 'Compile error: ' + e.message;
    }
  });
  </script>
</body>
</html>
